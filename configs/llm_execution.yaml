experiment:
  name: evitrust_llm_execution
  seeds: [42, 123, 2026]

generator:
  model_id: Qwen/Qwen2.5-VL-3B-Instruct
  deterministic: true
  temperature: 0.0
  max_new_tokens: 64
  load_in_4bit: true
  quantization: nf4

critic:
  model_id: Qwen/Qwen2.5-1.5B-Instruct
  prompt_version: evitrust-critic-v1
  mode: label_sequence_likelihood
  labels: [SUPPORTED, CONTRADICTED, INSUFFICIENT]
  load_in_4bit: true
  quantization: nf4

cross_family_verifier_ablation:
  enabled: true
  model_id: MoritzLaurer/DeBERTa-v3-base-mnli-fever-anli
  task: text_entailment
  role: verifier_ablation_only

retrieval:
  sources: [wikipedia, wikidata, conceptnet]
  top_k: 10
  filtered_top_k: 5
  cache: true

reliability:
  generator_weight: 0.35
  critic_support_weight: 0.40
  provenance_weight: 0.25
  contradiction_penalty: 0.35
  insufficiency_penalty: 0.15
  provenance_components:
    citation_validity: 0.60
    source_traceability: 0.30
    source_diversity: 0.10
  visual_consistency_in_primary_fusion: false

calibration:
  fit_split: validation
  methods: [platt, isotonic, temperature]
  report: [ece, brier, nll]

selective:
  target_risks: [0.01, 0.05, 0.10]
  primary_target_risk: 0.05
  report: [coverage, selective_accuracy, selective_risk, aurc]

robustness:
  corruption_types:
    - irrelevant_injection
    - synthetic_contradiction
    - source_dropout
    - evidence_scarcity
    - ranking_corruption
  severities: [0.10, 0.25, 0.50]

integrity:
  ground_truth_in_inference: false
  final_test_threshold_tuning: false
  checkpoint_resume: true
  save_prompt_version: true
  save_model_revision: true
  save_evidence_ids: true
  save_record_sha256: true
