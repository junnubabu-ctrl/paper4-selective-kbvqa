name: CPU integrity gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,analysis]"

      - name: Environment audit
        run: python scripts/inspect_environment.py

      - name: Run leakage and unit tests
        run: python -m pytest

      - name: Run deterministic development smoke test
        run: PYTHONPATH=src python scripts/dev_smoke.py
